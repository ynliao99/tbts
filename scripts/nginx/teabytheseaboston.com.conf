# Tea By The Sea 官网（纯静态，源码 github.com/ynliao99/tbts，发布用 scripts/deploy.sh）
# 部署位置：wordpress-server:/etc/nginx/sites.d/teabytheseaboston.com.conf
#
# 主域是裸域 teabytheseaboston.com，www 一律 301 到裸域。
# 现阶段只开 80：DNS 还在 Wix，证书签不出来。DNS 切到 47.89.231.163 后
# 用 certbot certonly --nginx 签证书，再加 443 段、把 80 改成跳 https。

# www → 裸域
server {
    listen 80;
    server_name www.teabytheseaboston.com;
    return 301 http://teabytheseaboston.com$request_uri;
}

# 主站
server {
    listen 80;
    server_name teabytheseaboston.com;

    root /data/sites/teabytheseaboston.com;
    index index.html;

    access_log /var/log/nginx/teabythesea.access.log main;
    error_log  /var/log/nginx/teabythesea.error.log;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 隐藏文件（.revision 等）不对外
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # HTML 每次回源校验，改版即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # css/js 只缓存 1 小时：js/data.js（菜单价格）链接不带版本号
    location ~* \.(css|js)$ {
        expires 1h;
        access_log off;
    }

    # 图片、字体缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }
}
