# Tea By The Sea 官网（纯静态，源码 github.com/ynliao99/tbts，发布用 scripts/deploy.sh）
# 部署位置：wordpress-server:/etc/nginx/sites.d/teabytheseaboston.com.conf
#
# 主域是裸域 https://teabytheseaboston.com；http 和 www 一律 301 过去。
# 证书：certbot certonly --nginx --cert-name teabytheseaboston.com
#   -d teabytheseaboston.com -d www.teabytheseaboston.com --post-hook "systemctl reload nginx"
# 由 certbot-renew.timer 每天检查、到期前 30 天自动续期，续完 reload nginx。

# 过渡期（2026-10-27 起，NS 从 Wix 切到阿里云 DNS，约 48 小时生效）：
# 部分解析器还把裸域指向 Wix，而 Wix 会把裸域 301 到 www。这时 www 再跳回裸域就会死循环，
# 所以 www 暂时直接出内容。全网生效后（约 2026-10-30 后）恢复下面注释里的 www → 裸域跳转。
#
# server {
#     listen 443 ssl http2;
#     server_name www.teabytheseaboston.com;
#     ssl_certificate /etc/letsencrypt/live/teabytheseaboston.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/teabytheseaboston.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://teabytheseaboston.com$request_uri;
# }

# HTTP 全部跳转到 HTTPS（过渡期保留原主机名；恢复后改回 https://teabytheseaboston.com）
server {
    listen 80;
    server_name teabytheseaboston.com www.teabytheseaboston.com;
    return 301 https://$host$request_uri;
}

# 主站（过渡期同时承接 www）
server {
    listen 443 ssl http2;
    server_name teabytheseaboston.com www.teabytheseaboston.com;

    ssl_certificate /etc/letsencrypt/live/teabytheseaboston.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teabytheseaboston.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /data/sites/teabytheseaboston.com;
    index index.html;

    access_log /var/log/nginx/teabythesea.access.log main;
    error_log  /var/log/nginx/teabythesea.error.log;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 隐藏文件（.revision 等）不对外
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # HTML 每次回源校验，改版即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # css/js 只缓存 1 小时：js/data.js（菜单价格）链接不带版本号
    location ~* \.(css|js)$ {
        expires 1h;
        access_log off;
    }

    # 图片、字体缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }
}
