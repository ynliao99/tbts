# Tea By The Sea 官网（Vue + vite-ssg 预渲染的静态站，源码 github.com/ynliao99/tbts，发布用 scripts/deploy.sh）
# 部署位置：wordpress-server:/etc/nginx/sites.d/teabytheseaboston.com.conf
#
# 主域是裸域 https://teabytheseaboston.com；http 和 www 一律 301 过去。
# 证书：certbot certonly --nginx --cert-name teabytheseaboston.com
#   -d teabytheseaboston.com -d www.teabytheseaboston.com --post-hook "systemctl reload nginx"
# 由 certbot-renew.timer 每天检查、到期前 30 天自动续期，续完 reload nginx。
#
# 目录：
#   /data/sites/teabytheseaboston.com          代码（scripts/deploy.sh 本地打包后上传，旧版在 .prev）
#   /data/sites/teabytheseaboston.com-content  内容快照 site.json（Vectra CMS 发布任务写入，代码发布不会覆盖）

# 过渡期（2026-10-27 起，NS 从 Wix 切到阿里云 DNS，约 48 小时生效）：
# 部分解析器还把裸域指向 Wix，而 Wix 会把裸域 301 到 www。这时 www 再跳回裸域就会死循环，
# 所以 www 暂时直接出内容。全网生效后（约 2026-10-30 后）恢复下面注释里的 www → 裸域跳转。
#
# server {
#     listen 443 ssl http2;
#     server_name www.teabytheseaboston.com;
#     ssl_certificate /etc/letsencrypt/live/teabytheseaboston.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/teabytheseaboston.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://teabytheseaboston.com$request_uri;
# }

# 访客真实 IP（给 /api/ 反代按访客限流用）：
# 站点在阿里云 ESA 后面，ESA 把真实访客 IP 追加在 X-Forwarded-For 的最后一项（前面的项是客户端自己带的，不可信）。
# 只有来自 ESA 节点的请求才取这一项；直连源站的请求用 $remote_addr，防止伪造 X-Forwarded-For 绕过限流。
# 目前观察到的 ESA 回源地址段是 163.181.0.0/16；出现新的段时补在这里（不补也只是退回按节点 IP 限流）。
geo $tbts_from_esa {
    default         0;
    163.181.0.0/16  1;
}
map $http_x_forwarded_for $tbts_xff_last {
    "~(?<last>[0-9a-fA-F:.]+)\s*$"  $last;
    default                          "";
}
map "$tbts_from_esa:$tbts_xff_last" $tbts_client_ip {
    "~^1:(?<ip>.+)$"  $ip;
    default           $remote_addr;
}

# HTTP 全部跳转到 HTTPS（过渡期保留原主机名；恢复后改回 https://teabytheseaboston.com）
server {
    listen 80;
    server_name teabytheseaboston.com www.teabytheseaboston.com;
    return 301 https://$host$request_uri;
}

# 主站（过渡期同时承接 www）
server {
    listen 443 ssl http2;
    server_name teabytheseaboston.com www.teabytheseaboston.com;

    ssl_certificate /etc/letsencrypt/live/teabytheseaboston.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teabytheseaboston.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /data/sites/teabytheseaboston.com;

    access_log /var/log/nginx/teabythesea.access.log main;
    error_log  /var/log/nginx/teabythesea.error.log;

    # 安全响应头（各 location 里有 add_header 时会覆盖这里，所以那些 location 用 include 再带一遍）
    include /etc/nginx/snippets/teabythesea-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 页面：/、/menu、/privacy、/terms 对应预渲染出的 index.html、menu.html…；HTML 每次回源校验
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/teabythesea-headers.conf;
    }
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/teabythesea-headers.conf;
    }

    # 旧地址 301 到新地址（查询参数保留；#cat-… 锚点浏览器会自己带上）
    location = /index.html   { return 301 /$is_args$args; }
    location = /menu.html    { return 301 /menu$is_args$args; }
    location = /privacy.html { return 301 /privacy$is_args$args; }
    location = /terms.html   { return 301 /terms$is_args$args; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/teabythesea-headers.conf;
    }

    # CMS 内容快照：Vectra 发布任务写入，浏览器每次带 ETag 校验，没变只回 304
    location = /content/site.json {
        alias /data/sites/teabytheseaboston.com-content/site.json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/teabythesea-headers.conf;
    }
    location /content/ { return 404; }

    # Vectra 公开接口（CMS 草稿预览、活动咨询）同域反代，浏览器不直接访问 API 域名。
    # 走内网直连 panel（不经 EdgeOne），带上访客真实 IP（见文件开头 $tbts_client_ip）和共享密钥，后端按访客 IP 限流。
    # 密钥片段 /etc/nginx/snippets/teabythesea-proxy-key.conf 只在服务器上（root 600），不进仓库。
    location /api/ {
        limit_except GET POST { deny all; }
        client_max_body_size 16k;
        proxy_pass https://172.27.235.7/portal_backend_v2/api/mc/tbts/;   # 内网直连用后端内部路径（对外的 /backend_v2 是 EdgeOne 那层改写的）
        proxy_set_header Host api.portal.uswoo.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name api.portal.uswoo.cn;
        proxy_set_header X-TBTS-Client-IP $tbts_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/teabythesea-proxy-key.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header Set-Cookie;
        include /etc/nginx/snippets/teabythesea-headers.conf;
    }

    # 隐藏文件（.revision 等）不对外
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Vite 打包出的 js/css 文件名带内容 hash，可以永久缓存
    location ~* ^/assets/[^/]+\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/teabythesea-headers.conf;
        access_log off;
    }

    # 图片、字体缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }
}
